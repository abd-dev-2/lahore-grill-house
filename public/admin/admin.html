<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lahore Grill House Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>

    <header class="admin-header">

        <h1>Lahore Grill House</h1>

        <p>Admin Dashboard</p>

    </header>


    <main class="dashboard">

        <section class="stats">

            <div class="stat-card">
                <h2 id="reservation-count">0</h2>
                <p>Reservations</p>
            </div>

            <div class="stat-card">
                <h2 id="message-count">0</h2>
                <p>Messages</p>
            </div>

        </section>


        <section class="panel">

            <h2>Reservations</h2>

            <div id="reservations-container">

                <p>Loading reservations...</p>

            </div>

        </section>


        <section class="panel">

            <h2>Contact Messages</h2>

            <div id="messages-container">

                <p>Loading messages...</p>

            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
